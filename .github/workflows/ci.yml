# Tests every push and pull request, and builds the image. Only a version
# tag publishes the image and the Helm chart to the GitHub Container
# Registry, under that version and nothing else:
#   git tag v1.2.0 && git push origin v1.2.0
#   -> ghcr.io/<owner>/prometheus-msteams:v1.2.0         (image)
#   -> oci://ghcr.io/<owner>/charts/prometheus-msteams 1.2.0  (chart, appVersion v1.2.0)
# There is no moving tag (no :latest, no :master): a deployment names the
# exact version it runs.
# Only GitHub's own actions are used; the rest is plain go and docker.
name: ci

on:
  push:
    branches: [master]
    # vMAJOR.MINOR.PATCH, optionally with a pre-release suffix (v1.2.0-rc.1).
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt-formatted:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race -coverprofile=coverage.txt ./...

      - name: coverage
        run: go tool cover -func=coverage.txt | tail -1 >> "$GITHUB_STEP_SUMMARY"

      # helm is installed on GitHub's Ubuntu runners.
      - name: chart
        run: sh chart/test.sh

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push to ghcr.io with the workflow's own token
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # all tags, for git describe

      - name: build
        run: |
          # The registry needs a lower-case name.
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          docker build \
            --build-arg VERSION="$(git describe --tags --always)" \
            --build-arg COMMIT="$(git rev-parse --short HEAD)" \
            --build-arg BRANCH="$GITHUB_REF_NAME" \
            --build-arg BUILD_DATE="$(date -u +%FT%TZ)" \
            --label org.opencontainers.image.source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            -t "$image:build" .

      - name: smoke test
        run: docker run --rm "$IMAGE:build" -version

      - name: push
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag "$IMAGE:build" "$IMAGE:$GITHUB_REF_NAME"
          docker push "$IMAGE:$GITHUB_REF_NAME"

      # The chart gets the same version, without the "v" (Helm wants plain
      # semver), and the image tag as appVersion, so by default it deploys
      # the image of the same release.
      - name: push chart
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          helm package chart/prometheus-msteams \
            --version "${GITHUB_REF_NAME#v}" --app-version "$GITHUB_REF_NAME" -d dist
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          helm push dist/prometheus-msteams-*.tgz "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"
