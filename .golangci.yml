version: "2"

linters:
  default: none
  enable:
    - bodyclose
    - depguard
    - dogsled
    - dupl
    - errcheck
    - funlen
    - gochecknoinits
    - goconst
    - gocritic
    - gocyclo
    - goprintffuncname
    - gosec
    - govet
    - ineffassign
    - misspell
    - nakedret
    - revive
    - rowserrcheck
    - staticcheck
    - unconvert
    - unparam
    - whitespace
  settings:
    funlen:
      lines: 120
      statements: 50
    misspell:
      locale: US
    depguard:
      rules:
        main:
          allow:
            - $gostd
            - github.com/aursu/prometheus-msteams
            - github.com/google/go-cmp/cmp
            - github.com/hashicorp/go-retryablehttp
            - github.com/Masterminds/sprig/v3
            - github.com/oklog/run
            - github.com/peterbourgon/ff/v3
            - github.com/prometheus/alertmanager/notify/webhook
            - github.com/prometheus/alertmanager/template
            - github.com/prometheus/client_golang/prometheus
            - github.com/santhosh-tekuri/jsonschema/v6
            - go.yaml.in/yaml/v3
            - golang.org/x/text
  exclusions:
    rules:
      - linters:
          - revive
        text: "don't use ALL_CAPS in Go names"
      - linters:
          - staticcheck
        text: "ST1003: should not use ALL_CAPS in Go names"
      - path: _test\.go
        linters:
          - gocyclo
          - errcheck
          - dupl
          - gosec
          - funlen

formatters:
  enable:
    - gofmt
    - goimports
