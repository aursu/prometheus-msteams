# Every option the chart has, for `helm lint` and chart/test.sh.
channels:
  - path: /critical
    urlKey: critical
  - path: /compact
    urlKey: warnings
    template: compact
  - path: /legacy
    urlKey: legacy
    escapeUnderscores: true
urlSecret:
  name: teams-urls
templates:
  compact: |
    {{ define "teams.card" }}{"type": "message"}{{ end }}
defaultTemplate: compact
contacts:
  default: platform
  groups:
    platform:
      primary: [{name: Jane Doe, id: jane@example.org}]
      backup: [{name: John Roe, id: john@example.org}]
extraArgs:
  - -max-card-size=20000
serviceMonitor:
  enabled: true
  labels:
    release: kube-prometheus-stack
