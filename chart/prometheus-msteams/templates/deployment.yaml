{{- $secret := required "urlSecret.name: the Secret with the Workflow URLs is required" .Values.urlSecret.name }}
{{- with .Values.defaultTemplate }}
{{- include "promteams.checkTemplate" (list $ . "defaultTemplate") }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "promteams.fullname" . }}
  labels:
    {{- include "promteams.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "promteams.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "promteams.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # The configuration is read once, at startup: a changed ConfigMap
        # changes this checksum, and with it the pods are replaced.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      # The service does not talk to the Kubernetes API.
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: prometheus-msteams
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - -config-file=/etc/config/connectors.yaml
            {{- with .Values.defaultTemplate }}
            - -template-file={{ include "promteams.templatePath" . }}
            {{- end }}
            {{- with .Values.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 2000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            periodSeconds: 20
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/config
              readOnly: true
            - name: urls
              mountPath: /etc/teams
              readOnly: true
            {{- if .Values.templates }}
            - name: templates
              mountPath: /etc/templates
              readOnly: true
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "promteams.fullname" . }}
        - name: urls
          secret:
            secretName: {{ $secret }}
            # Owner root, group fsGroup (podSecurityContext): readable by
            # the service, by no other user.
            defaultMode: 0440
        {{- if .Values.templates }}
        - name: templates
          configMap:
            name: {{ include "promteams.fullname" . }}-templates
        {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
