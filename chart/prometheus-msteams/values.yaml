# The Teams channels: one request path per Teams Workflow. Alertmanager
# posts to http://<service>:<port><path>.
channels: []
# - path: /critical
#   # The key of urlSecret that holds this channel's Workflow URL.
#   urlKey: critical
#   # Optional: a template from "templates" below, by name; without it the
#   # default template is used.
#   template: compact
#   # Optional: -auto-escape-underscores for this channel; only for
#   # templates that do not escape values themselves.
#   escapeUnderscores: false

# The Secret with the Workflow URLs, one key per channel. Required. It is
# not created by this chart: the URLs are credentials and do not belong in
# values. Create it with kubectl, External Secrets, Sealed Secrets, ...
# The service reads the URLs at startup; restart it after a change.
urlSecret:
  name: ""

# Card templates of your own, by name. Each defines "teams.card"; see the
# project README for the data and functions available.
templates: {}
#   compact: |
#     {{ define "teams.card" }}
#     ...
#     {{ end }}

# The template for channels without "template": a name from "templates".
# Empty: the default template built into the image.
defaultTemplate: ""

# More command-line flags, e.g. -max-card-size=20000 or -debug.
extraArgs: []

image:
  repository: ghcr.io/aursu/prometheus-msteams
  # Empty: the chart's appVersion, the release this chart was made for.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

replicaCount: 1

service:
  type: ClusterIP
  port: 2000

# A ServiceMonitor for the Prometheus Operator, scraping /metrics.
serviceMonitor:
  enabled: false
  labels: {}
  interval: 30s

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

# The image runs as 65532:65532. fsGroup gives the mounted Secret files that
# group, so the service can read them with mode 0440.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

podLabels: {}
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
priorityClassName: ""

nameOverride: ""
fullnameOverride: ""
